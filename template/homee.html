<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Churn Prediction</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .main-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        h3 {
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
        }

        label {
            font-weight: 600;
            margin-top: 8px;
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-submit {
            background: #5a67d8;
            color: white;
            font-weight: bold;
            border-radius: 25px;
            padding: 12px 35px;
            border: none;
        }

        .btn-submit:hover {
            background: #434190;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .danger {
            background: #f8d7da;
            color: #721c24;
        }

        .section-title {
            background: #edf2f7;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container mt-4 mb-4">
    <div class="main-card">

        <h3>📊 Customer Churn Prediction System</h3>

        <form method="POST">

            <div class="row">

                <!-- LEFT COLUMN -->
                <div class="col-md-6">

                    <div class="section-title">Personal & Billing Info</div>

                    <label>Senior Citizen</label>
                    <select class="form-control" name="query1">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>

                    <label>Monthly Charges</label>
                    <input type="number" step="0.01" class="form-control" name="query2">

                    <label>Total Charges</label>
                    <input type="number" step="0.01" class="form-control" name="query3">

                    <label>Gender</label>
                    <select class="form-control" name="query4">
                        <option>Male</option>
                        <option>Female</option>
                    </select>

                    <label>Partner</label>
                    <select class="form-control" name="query5">
                        <option>Yes</option>
                        <option>No</option>
                    </select>

                    <label>Dependents</label>
                    <select class="form-control" name="query6">
                        <option>Yes</option>
                        <option>No</option>
                    </select>

                    <label>Phone Service</label>
                    <select class="form-control" name="query7">
                        <option>Yes</option>
                        <option>No</option>
                    </select>

                    <label>Multiple Lines</label>
                    <select class="form-control" name="query8">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No phone service</option>
                    </select>
                </div>

                <!-- RIGHT COLUMN -->
                <div class="col-md-6">

                    <div class="section-title">Service Details</div>

                    <label>Internet Service</label>
                    <select class="form-control" name="query9">
                        <option>DSL</option>
                        <option>Fiber optic</option>
                        <option>No</option>
                    </select>

                    <label>Online Security</label>
                    <select class="form-control" name="query10">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No internet service</option>
                    </select>

                    <label>Online Backup</label>
                    <select class="form-control" name="query11">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No internet service</option>
                    </select>

                    <label>Device Protection</label>
                    <select class="form-control" name="query12">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No internet service</option>
                    </select>

                    <label>Tech Support</label>
                    <select class="form-control" name="query13">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No internet service</option>
                    </select>

                    <label>Streaming TV</label>
                    <select class="form-control" name="query14">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No internet service</option>
                    </select>

                    <label>Streaming Movies</label>
                    <select class="form-control" name="query15">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No internet service</option>
                    </select>

                    <label>Contract</label>
                    <select class="form-control" name="query16">
                        <option>Month-to-month</option>
                        <option>One year</option>
                        <option>Two year</option>
                    </select>

                    <label>Paperless Billing</label>
                    <select class="form-control" name="query17">
                        <option>Yes</option>
                        <option>No</option>
                    </select>

                    <label>Payment Method</label>
                    <select class="form-control" name="query18">
                        <option>Electronic check</option>
                        <option>Mailed check</option>
                        <option>Bank transfer</option>
                        <option>Credit card</option>
                    </select>

                    <label>Tenure</label>
                    <input type="number" class="form-control" name="query19">
                </div>
            </div>

            <div class="text-center mt-4">
                <button class="btn-submit">🔍 Predict Churn</button>
            </div>

        </form>

        {% if output1 %}
        <div class="result-box {{ 'danger' if 'Churn' in output1 else 'success' }}">
            {{ output1 }} <br>
            {{ output2 }}
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
